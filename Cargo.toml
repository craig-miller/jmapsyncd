[package]
name = "jmapsyncd"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
anyhow = "1"
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
jmap-client = "0.4"
notify = "7"
maildir = "0.4"
globset = "0.4"
shellexpand = "3"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
serde_rusqlite = "0.35"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Consume the craig-miller/jmap-client zentoo branch until upstream merges
# the empty-State-event skip fix — Fastmail's opening ":new event source
# connection\r\n\r\n" keep-alive triggers a serde_json EOF error in 0.4.2
# and forces reconnect every ~5s. See craig-miller/jmap-client@bf59494.
[patch.crates-io]
jmap-client = { git = "https://github.com/craig-miller/jmap-client.git", branch = "zentoo" }
